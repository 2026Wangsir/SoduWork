<style>html,body{height:100%;margin:0}body{font-family:var(--font-ui);color:var(--ink)}#fixtureNotice{position:fixed;bottom:16px;left:260px;z-index:600;background:var(--bg-0);font:13px var(--font-ui);color:var(--ink-2);padding:8px 14px;border-radius:10px;pointer-events:none}#fixtureNotice:empty{display:none}</style>
<script>
window.__deskPanel='workspace';window.workRoot=()=>'';let eventSink=null,seq=0;
window.SoduworkLocalizedText={pickLocale:()=>'',currentLocale:()=> 'zh-CN',resolve:(item,field)=>String(item?.[field]||'')};
window.calls={routes:[],sent:[],created:[],parsed:[],closed:[]};window.createFail=false;window.blocked=false;
window.execution={substrates:[
 ...['pi','qwen','opencode','dsh','kimi','harness2','codex-harness'].map(cli=>({key:'local:'+cli,cli,name:cli,modelMode:'managed',modelPick:true,available:true,onlineSeats:1})),
 ...['codex','claude'].map(cli=>({key:'local:'+cli,cli,name:cli,modelMode:'account',modelPick:false,nativeModelPick:cli==='codex',available:true,onlineSeats:1})),
],modelOptions:[{name:'managed-model',label:'托管模型'}],defaultModel:'managed-model',repos:[]};
window.esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.petSay=s=>document.getElementById('fixtureNotice').textContent=s;
window.expandForOverlay=()=>{};window.shrinkFromOverlay=()=>{};window.makeDraggable=()=>{};
window.fetch=()=>{throw Error('Network forbidden in isolated fixture')};
const snap=()=>({status:'idle',statusText:'',messages:[],tools:[],usage:null,pendingUi:null});
window.SoduWorkAPI={
 listSchedules:async()=>calls.created.map((p,i)=>({...p,id:'s'+i})),
 listScheduleTemplates:async()=>[{id:'weekly',name:'每周团队简报',note:'汇总团队工作',every:'weekly',atHour:9,atMinute:0,weekday:5,timeZone:'Asia/Shanghai'}],
 taskExecutionOptions:async()=>execution,
 listAIAgents:async()=>({agents:[{id:'pi',name:'Pi',cli:'pi'}]}),listRepos:async()=>[],
 myModels:async()=>({defaultModels:{pi:'local:model-0123456789abcdef0123456789abcdef',qwen:'local:model-0123456789abcdef0123456789abcdef'},usable:[{id:'local:model-0123456789abcdef0123456789abcdef',name:'local:model-0123456789abcdef0123456789abcdef',modelName:'glm5.2',label:'glm5.2',providerName:'自己模型',localOnly:true}]}),pluginCatalog:async()=>({items:[]}),
 preflightSchedule:async()=>({state:blocked?'blocked':'ready',message:blocked?'执行机未就绪':'执行条件已就绪',checks:[]}),
 parseTaskText:async(text)=>{calls.parsed.push(text);return{title:'每日工作简报',note:text,acceptanceCriteria:['保留进展、风险与明日计划']}},
 createSchedule:async(body)=>{if(createFail)throw Error('保存暂时失败，请重试');calls.created.push(body);return{...body,id:'s'+calls.created.length}},
 updateSchedule:async(id,body)=>{if(createFail)throw Error('保存暂时失败，请重试');calls.created[Number(id.slice(1))]=body;return{...body,id}},
};
window.soduWorkAPI={conversationSession:{
 capabilities:async()=>({ok:true,items:[]}),history:async()=>({ok:true,chats:[]}),probe:async()=>({ok:true}),
 open:async(options={})=>({ok:true,ref:'new:'+(++seq),sessionId:'fixture-'+seq,model:{},snapshot:snap()}),
 onEvent:fn=>{eventSink=fn;return()=>{}},
 send:async(ref,text)=>{calls.sent.push({ref,text});return{ok:true}},close:ref=>calls.closed.push(ref),cancel:()=>{}
}};
window.WorkspaceHost={open:(view,payload={})=>{
 calls.routes.push({view,payload});WorkspaceShell.setActive(view);
 if(view==='create')return openComposePanel(payload);
 if(view==='schedules'){document.getElementById('composePanel')?.classList.remove('show');openSchedulePanel()}
}};
</script>
